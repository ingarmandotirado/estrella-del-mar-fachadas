  for (const [a, b] of [[-.2, -.2], [.2, -.2], [-.2, .2], [.2, .2]]) pieza(g, .035, .45, .035, a, .225, b, MOB.marco); }
function mesa(x, y, z, r = .45){ const g = grupo(x, y, z); const t = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .04, 24), MOB.mesa); t.position.y = .74; t.castShadow = true; g.add(t);
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .72, 8), MOB.marco); p.position.y = .37; g.add(p); return g; }
function comedor(x, y, z, n = 4){ mesa(x, y, z); for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2 + Math.PI / 4; silla(x + Math.sin(a) * .72, y, z + Math.cos(a) * .72, a + Math.PI); } }
function camastro(x, y, z, rot){ const g = grupo(x, y, z, rot); pieza(g, .62, .12, 1.35, 0, .3, .15, MOB.cojin); pieza(g, .62, .1, .7, 0, .55, -.78, MOB.cojin, .75);
  pieza(g, .66, .08, 1.95, 0, .2, -.05, MOB.marco); for (const [a, b] of [[-.28, .85], [.28, .85], [-.28, -.85], [.28, -.85]]) pieza(g, .04, .2, .04, a, .1, b, MOB.marco); }
function sillon(x, y, z, rot){ const g = grupo(x, y, z, rot); pieza(g, .8, .38, .78, 0, .22, 0, MOB.cojin2); pieza(g, .8, .42, .16, 0, .6, -.31, MOB.cojin2); for (const s of [-1, 1]) pieza(g, .14, .3, .78, s * .33, .5, 0, MOB.cojin2); }
function sofa(x, y, z, rot, L = 1.9){ const g = grupo(x, y, z, rot); pieza(g, L, .38, .82, 0, .22, 0, MOB.cojin2); pieza(g, L, .45, .16, 0, .62, -.33, MOB.cojin2); for (const s of [-1, 1]) pieza(g, .16, .3, .82, s * (L / 2 - .08), .5, 0, MOB.cojin2);
  for (let i = 0; i < 3; i++) pieza(g, .38, .3, .12, -L / 3 + i * L / 3, .58, -.22, MOB.cojin); }
function sombrilla(x, y, z){ const g = grupo(x, y, z); const p = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 2.4, 8), MOB.marco); p.position.y = 1.2; g.add(p);
  const c = new THREE.Mesh(new THREE.ConeGeometry(1.25, .45, 8, 1, true), MOB.sombrilla); c.position.y = 2.3; c.castShadow = true; g.add(c); }
function maceta(x, y, z, s = 1){ const g = grupo(x, y, z); pieza(g, .45 * s, .5 * s, .45 * s, 0, .25 * s, 0, MOB.marco); const h = new THREE.Mesh(new THREE.IcosahedronGeometry(.42 * s, 0), std('#4f7d3a', .9, { flatShading: true })); h.position.y = .8 * s; h.castShadow = true; g.add(h); }
// terraza cubierta de PB (bajo el balcón poniente): comedor y dos camastros con mesita
comedor(-1.45, N.pb - .1, -6.05, 6);                                                                                  // terraza baja: mesa con sillas
// alberca: camastros con sombrilla al oriente del agua
for (const x of [-9.1, -7.5, -5.9]) camastro(x, N.terreno, -11.75, 0); sombrilla(-8.3, N.terreno, -12.6); sombrilla(-6.7, N.terreno, -12.6);   // camastros al norte de la alberca
// balcón poniente de PA: comedor y camastros
{ const g = grupo(-1.45, N.pa, -6.05); pieza(g, .6, .06, 1.1, 0, .38, 0, MOB.madera); for (const [a, b] of [[-.26, -.5], [.26, -.5], [-.26, .5], [.26, .5]]) pieza(g, .05, .35, .05, a, .18, b, MOB.marco); }
sillon(-1.45, N.pa, -7.35, 0); sillon(-1.45, N.pa, -4.75, Math.PI);                                                    // balcón poniente: mesa baja y dos sillones de exterior
// balcón oriente de PA: dos sillones con mesita
sillon(8.25, N.pa, -12.2, 0); sillon(8.25, N.pa, -9.8, Math.PI); mesa(8.25, N.pa, -11.0, .3);   // sillones viendo hacia la mesita
// azotea bajo la pérgola: comedor redondo, dos sillones y sofá; macetas en el roof garden
comedor(3.5, N.az, -8.45); sillon(2.2, N.az, -6.95, Math.PI / 2); sillon(4.85, N.az, -6.95, -Math.PI / 2); sofa(3.55, N.az, -5.95, Math.PI, 1.9);
for (const [x, z] of [[.6, -12.1], [.6, -10.6], [.6, -3.0], [8.6, -2.2], [5.8, -1.6]]) maceta(x, N.az, z);
// grill encendido en la barra poniente: brasas y humo animado
{ const xg = -.31, zg = -13.25, yg = N.pb + 1.07;
  const brasa = new THREE.Mesh(new THREE.BoxGeometry(.4, .02, .6), new THREE.MeshStandardMaterial({ color: '#2a1408', emissive: '#ff5a1a', emissiveIntensity: 1.6 })); brasa.position.set(xg, yg - .03, zg); G.add(brasa);
  const luz = new THREE.PointLight('#ff7a30', 2.5, 3, 2); luz.position.set(xg, yg + .25, zg); G.add(luz);
  const humoMat = new THREE.MeshBasicMaterial({ color: '#d8d8d8', transparent: true, opacity: .35, depthWrite: false });
  const bolas = []; for (let i = 0; i < (MOVIL ? 10 : 18); i++){ const b = new THREE.Mesh(new THREE.SphereGeometry(.12, 10, 8), humoMat.clone()); b.userData.f = i / (MOVIL ? 10 : 18); G.add(b); bolas.push(b); }
  ANIM.push(t => { for (const b of bolas){ const f = (b.userData.f + t * .18) % 1, sz = .5 + f * 3.2;
      b.position.set(xg + Math.sin(f * 7 + b.userData.f * 20) * .12 * (1 + f * 3) - f * .5, yg + .1 + f * 2.6, zg + Math.cos(f * 5 + b.userData.f * 9) * .1 * (1 + f * 2));
      b.scale.setScalar(sz); b.material.opacity = .38 * (1 - f) * Math.min(1, f * 6); }
    luz.intensity = 2.2 + Math.sin(t * 13) * .4 + Math.sin(t * 7.3) * .3; brasa.material.emissiveIntensity = 1.4 + Math.sin(t * 9) * .3; }); }
// pérgola de la azotea (área cubierta 4.00 × 4.00 del plano: x 1.56–5.54, z −9.43 a −5.43; postes a 3.60), 2 vigas laterales y duelas
{ const [x0, z0, x1, z1] = [1.56, -9.43, 5.54, -5.43], px = [1.76, 5.34], pz = [-9.23, -5.63], yv = N.az + 2.45;
  for (const x of px) for (const z of pz) caja(x - .1, z - .1, x + .1, z + .1, N.az, yv, M.filo);
  for (const z of pz) caja(x0 - .15, z - .08, x1 + .15, z + .08, yv, yv + .25, M.madera);                               // vigas de madera a los costados
  for (let i = 0; i <= 13; i++){ const x = x0 + i * (x1 - x0) / 13; caja(x - .035, z0 - .2, x + .035, z1 + .2, yv + .25, yv + .38, M.madera); } }
// árboles sencillos alrededor
const hoja = std('#4f7d3a', .9, { flatShading: true }), tronco = std('#6b513b', .9);
for (const [x, z] of [[-8, -15], [-9, -1], [15, -3], [-10, 3.2], [15.5, 2.8], [3, -16], [11, -16]]){
  caja(x - .1, z - .1, x + .1, z + .1, N.terreno, N.terreno + 2.2, tronco); add(new THREE.IcosahedronGeometry(1.4, 0), hoja, x, N.terreno + 3.2, z); }
// ---- sol (aproximado) y vistas
function ponerSol(h){ const az = (h - 12) / 12 * Math.PI * 1.05, alt = Math.max(.08, Math.sin((h - 6) / 12 * Math.PI) * 1.15);
  sol.position.set(Math.sin(az) * 60, Math.sin(alt) * 60 + 6, -Math.cos(az) * 25 + 15); sol.target.position.set(4.8, 0, -6.8);
  sol.intensity = 2.6 * Math.min(1, alt * 2); document.getElementById('ht').textContent = `${Math.floor(h)}:${String(Math.round((h % 1) * 60)).padStart(2, '0')}`; }
const VIS = { 'Aérea': [[-22, 26, 24], [4.8, 3, -6.8]], 'Fachada sur (calle)': [[4.8, 4.5, 22], [4.8, 4.2, -6.8]], 'Fachada oriente (acceso)': [[32, 5, -6.8], [6.5, 4.2, -6.8]],
  'Fachada poniente (alberca)': [[-24, 5, -6.8], [2, 4.2, -6.8]], 'Fachada norte': [[4.8, 5, -36], [4.8, 4.2, -6.8]], 'Esquina sureste': [[24, 7, 16], [5, 4, -6]], 'Esquina suroeste': [[-18, 7, 14], [3, 4, -6]] };
const bar = document.getElementById('bar'); let tw = null;
for (const [n, v] of Object.entries(VIS)){ const b = document.createElement('button'); b.textContent = n; b.onclick = () => ir(n); bar.appendChild(b); }
function ir(n, inst){ [...bar.children].forEach(b => b.classList.toggle('on', b.textContent === n)); const [p, t] = VIS[n];
  if (inst){ cam.position.set(...p); ctl.target.set(...t); return; } tw = { k: 0, p0: cam.position.clone(), t0: ctl.target.clone(), p1: new THREE.Vector3(...p), t1: new THREE.Vector3(...t) }; }
{ const tj = document.getElementById('teja'); tj.append('Teja');
  for (const [n, [c1, c2, pr]] of Object.entries(TEJAS)){ const b = document.createElement('button'); b.title = n; b.style.background = `linear-gradient(135deg, ${c1} 50%, ${c2} 50%)`;
    b.onclick = () => { M.teja.map.dispose(); M.teja.map = tejaTex(c1, c2, pr); M.teja.needsUpdate = true; [...tj.querySelectorAll('button')].forEach(x => x.classList.toggle('on', x === b)); };
    tj.appendChild(b); } tj.querySelector('button').classList.add('on'); }
const hr = document.getElementById('h'); hr.oninput = () => ponerSol(+hr.value); ponerSol(+hr.value);
function rs(){ const w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); } addEventListener('resize', rs); rs();
ir('Aérea', true); document.getElementById('load').remove();
window.__v = { cam, ctl, R, S, render: () => { ctl.update(); R.render(S, cam); } };
const ck = new THREE.Clock();
R.setAnimationLoop(() => { const dt = ck.getDelta(); const tt = ck.elapsedTime; ANIM.forEach(f => f(tt)); if (tw){ tw.k = Math.min(1, tw.k + dt / 1.1); const e = tw.k * tw.k * (3 - 2 * tw.k); cam.position.lerpVectors(tw.p0, tw.p1, e); ctl.target.lerpVectors(tw.t0, tw.t1, e); if (tw.k >= 1) tw = null; }
  ctl.update(); R.render(S, cam); });
